<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>YouTube Carousel</title>
    <style>
        body, html { 
            margin: 0; padding: 0; height: 100%; overflow: hidden; 
            background: black; cursor: none; 
        }
 
        #player-video { width: 100vw; height: 100vh; pointer-events: none !important; }
        #player-audio { position: absolute; top: -9999px; left: -9999px; width: 1px; height: 1px; }
        #shield { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 9999; background: transparent; cursor: none; }
        
        #title-mask {
            position: absolute; top: 0; left: 0; width: 100%; height: 140px;
            background: linear-gradient(to bottom, rgba(0,0,0,1) 0%, rgba(0,0,0,0) 100%);
            z-index: 10000; opacity: 0; transition: opacity 0.8s ease-in-out; pointer-events: none;
        }
 
        #timer-display {
            position: absolute;
            bottom: 20px;
            right: 30px;
            color: rgba(255, 255, 255, 0.7);
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            font-size: 24px;
            font-weight: 300;
            z-index: 10001;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
            letter-spacing: 1px;
            pointer-events: none;
        }
 
        /* Overlay di errore - mostrato solo in caso di problemi */
        #error-overlay {
            display: none;
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: black;
            z-index: 20000;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            color: rgba(255,255,255,0.6);
            font-family: 'Segoe UI', sans-serif;
        }
        #error-overlay.visible { display: flex; }
        #error-overlay span { font-size: 18px; margin-top: 12px; }
        #error-overlay .retry-bar {
            margin-top: 20px;
            width: 200px; height: 3px;
            background: rgba(255,255,255,0.15);
            border-radius: 2px;
            overflow: hidden;
        }
        #error-overlay .retry-fill {
            height: 100%;
            background: rgba(255,255,255,0.5);
            width: 0%;
            transition: width linear;
        }
    </style>
</head>
<body>
 
    <div id="shield"></div>
    <div id="title-mask"></div>
    
    <div id="player-video"></div>
    <div id="player-audio"></div>
 
    <div id="timer-display">00:00</div>
 
    <!-- Overlay mostrato solo se YouTube non parte affatto -->
    <div id="error-overlay">
        <span>⏳</span>
        <span id="error-msg">Caricamento in corso...</span>
        <div class="retry-bar"><div class="retry-fill" id="retry-fill"></div></div>
    </div>
 
    <script>
        // ─── CONFIGURAZIONE ───────────────────────────────────────────────────
        const myPlaylistId      = 'PLhNnjrSmvk-NC1dFuMu1T4qonEkt9L1vP'; 
        const audioVideoId      = 'PO7FETKjmA4'; 
        const changeEverySeconds = 150;
        const MAX_CONSECUTIVE_ERRORS = 5;   // dopo N errori di fila → skip forzato
        const RETRY_DELAY_MS         = 8000; // attesa prima di riprovare dopo errore grave
        // ─────────────────────────────────────────────────────────────────────
 
        let videoPlayer, audioPlayer;
        let secondsRemaining   = changeEverySeconds;
        let availableIndices   = [];
        let consecutiveErrors  = 0;
        let timerInterval      = null;
        let playerReady        = false;
        let audioReady         = false;
 
        // ── Carica API YouTube ────────────────────────────────────────────────
        const tag = document.createElement('script');
        tag.src   = "https://www.youtube.com/iframe_api";
        document.head.appendChild(tag);
 
        function onYouTubeIframeAPIReady() {
            videoPlayer = new YT.Player('player-video', {
                height: '1080',
                width:  '1920',
                playerVars: {
                    listType:       'playlist', 
                    list:           myPlaylistId,
                    autoplay:       1, 
                    mute:           1, 
                    controls:       0, 
                    modestbranding: 1, 
                    rel:            0, 
                    disablekb:      1,
                    vq:             'hd1080',
                    // FIX PRINCIPALE: origin evita blocchi cross-origin da Brave/Firefox
                    origin:         window.location.origin || 'https://localhost'
                },
                events: {
                    'onReady':       onVideoReady,
                    'onStateChange': onVideoStateChange,
                    'onError':       onVideoError
                }
            });
 
            audioPlayer = new YT.Player('player-audio', {
                height:  '1',
                width:   '1',
                videoId: audioVideoId,
                playerVars: {
                    autoplay: 1,
                    controls: 0,
                    loop:     1,
                    playlist: audioVideoId,
                    origin:   window.location.origin || 'https://localhost'
                },
                events: {
                    'onReady': onAudioReady,
                    'onError': onAudioError
                }
            });
        }
 
        // ── Gestione player video ─────────────────────────────────────────────
        function onVideoReady(event) {
            playerReady = true;
            forceHD(event.target);
            hideErrorOverlay();
            refreshIndices();
            playNextSmart(); 
            startTimer();
        }
 
        function onVideoStateChange(event) {
            if (event.data === YT.PlayerState.PLAYING) {
                consecutiveErrors = 0;   // reset contatore errori
                forceHD(event.target);
                hideErrorOverlay();
            }
            if (event.data === YT.PlayerState.ENDED) {
                playNextSmart();
            }
            // BUFFERING bloccato troppo a lungo → skip
            if (event.data === YT.PlayerState.BUFFERING) {
                clearTimeout(window._bufferTimeout);
                window._bufferTimeout = setTimeout(() => {
                    const state = videoPlayer.getPlayerState();
                    if (state === YT.PlayerState.BUFFERING) {
                        console.warn('Buffering troppo lungo, skip video');
                        playNextSmart();
                    }
                }, 15000); // 15 secondi di buffering → skip
            }
        }
 
        function onVideoError(event) {
            // Codici errore YouTube:
            // 2  → parametro non valido
            // 5  → errore HTML5 player
            // 100 → video non trovato / privato
            // 101/150 → embedding non permesso
            console.warn('Errore player video, codice:', event.data);
            consecutiveErrors++;
 
            if (consecutiveErrors >= MAX_CONSECUTIVE_ERRORS) {
                // Troppi errori di fila: aspetta un po' e ricarica la pagina
                showErrorOverlay('Troppi errori consecutivi, riavvio tra poco...', RETRY_DELAY_MS);
                setTimeout(() => location.reload(), RETRY_DELAY_MS);
                return;
            }
 
            // Altrimenti salta al prossimo video
            setTimeout(playNextSmart, 1500);
        }
 
        // ── Gestione player audio ─────────────────────────────────────────────
        function onAudioReady(event) {
            audioReady = true;
            event.target.setVolume(50);
            event.target.playVideo();
        }
 
        function onAudioError(event) {
            // Il video audio non è disponibile: silenzio, ma il carosello continua
            console.warn('Player audio non disponibile (codice:', event.data, ') - procedo senza audio.');
            audioReady = false;
        }
 
        // ── Timer countdown ───────────────────────────────────────────────────
        function startTimer() {
            if (timerInterval) clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                secondsRemaining--;
                updateTimerDisplay();
                if (secondsRemaining <= 0) playNextSmart();
            }, 1000);
        }
 
        function updateTimerDisplay() {
            const mins = Math.floor(Math.abs(secondsRemaining) / 60);
            const secs = Math.abs(secondsRemaining) % 60;
            document.getElementById('timer-display').innerText = 
                (mins < 10 ? "0" : "") + mins + ":" + (secs < 10 ? "0" : "") + secs;
        }
 
        // ── Logica playlist ───────────────────────────────────────────────────
        function refreshIndices() {
            try {
                const playlist = videoPlayer.getPlaylist();
                availableIndices = [];
                if (playlist && playlist.length > 0) {
                    for (let i = 0; i < playlist.length; i++) availableIndices.push(i);
                }
            } catch(e) {
                console.warn('Impossibile leggere la playlist:', e);
            }
        }
 
        function playNextSmart() {
            clearTimeout(window._bufferTimeout);
            try {
                const playlist = videoPlayer.getPlaylist();
                if (!playlist || playlist.length === 0) return;
                if (availableIndices.length === 0) refreshIndices();
 
                const randomIndexInArray = Math.floor(Math.random() * availableIndices.length);
                const videoIndexToPlay   = availableIndices[randomIndexInArray];
                availableIndices.splice(randomIndexInArray, 1);
 
                videoPlayer.playVideoAt(videoIndexToPlay);
                secondsRemaining = changeEverySeconds;
                showMaskTemporarily();
            } catch(e) {
                console.error('Errore in playNextSmart:', e);
            }
        }
 
        // ── Utilità ───────────────────────────────────────────────────────────
        function forceHD(player) {
            try {
                if (player && player.setPlaybackQuality) {
                    player.setPlaybackQuality('hd1080');
                }
            } catch(e) {}
        }
 
        function showMaskTemporarily() {
            const mask = document.getElementById('title-mask');
            mask.style.opacity = "1";
            setTimeout(() => { mask.style.opacity = "0"; }, 7000);
        }
 
        function showErrorOverlay(msg, durationMs) {
            const overlay = document.getElementById('error-overlay');
            document.getElementById('error-msg').innerText = msg || 'Errore di caricamento...';
            overlay.classList.add('visible');
 
            // Barra di avanzamento animata
            const fill = document.getElementById('retry-fill');
            fill.style.transition = 'none';
            fill.style.width = '0%';
            requestAnimationFrame(() => {
                fill.style.transition = `width ${durationMs}ms linear`;
                fill.style.width = '100%';
            });
        }
 
        function hideErrorOverlay() {
            document.getElementById('error-overlay').classList.remove('visible');
        }
 
        // ── Auto-riavvio ogni 4 ore (evita memory leak su Raspberry) ─────────
        setTimeout(() => { location.reload(); }, 4 * 60 * 60 * 1000);
 
        document.addEventListener('mouseenter', () => { document.body.style.cursor = 'none'; });
    </script>
</body>
</html>
